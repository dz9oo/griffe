[package]
name = "freeflow-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "freeflow_cli"
path = "src/lib.rs"

[[bin]]
name = "freeflow"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
freeflow-core = { version = "0.1.0", path = "../freeflow-core" }
freeflow-docs = { version = "0.1.0", path = "../freeflow-docs" }
freeflow-invoice = { version = "0.1.0", path = "../freeflow-invoice" }
rpassword = "7.5.4"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
assert_cmd = "2.2.2"
freeflow-core = { version = "0.1.0", path = "../freeflow-core", features = ["test-support"] }
insta = { version = "1.48.0", features = ["json", "redactions"] }
predicates = "3.1.4"
