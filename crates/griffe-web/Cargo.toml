[package]
name = "griffe-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["multipart"] }
griffe-cli = { version = "0.3.1", path = "../griffe-cli" }
griffe-core = { version = "0.3.1", path = "../griffe-core" }
griffe-docs = { version = "0.3.1", path = "../griffe-docs" }
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["catch-panic"] }

[dev-dependencies]
http-body-util = "0.1.5"
uuid = { version = "1.26.0", features = ["v7"] }
