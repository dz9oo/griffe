[package]
name = "freeflow-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "freeflow-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
freeflow-cli = { version = "0.1.0", path = "../freeflow-cli" }
freeflow-core = { version = "0.1.0", path = "../freeflow-core" }
freeflow-docs = { version = "0.1.0", path = "../freeflow-docs" }
freeflow-invoice = { version = "0.1.0", path = "../freeflow-invoice" }
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json", "redactions"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client"] }
uuid = { version = "1.26.0", features = ["v7"] }
