[package]
name = "griffe-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
argon2 = "0.6.0"
calamine = "0.36"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
dirs = "6.0.0"
encoding_rs = "0.8.35"
hex = "0.4.3"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["backup", "bundled-sqlcipher"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"

[features]
# Expose `store::testing` : un magasin de clés en mémoire pour les tests d'autres crates, qui ne
# doivent ni polluer le trousseau OS réel de la machine ni muter l'environnement du process
# (`unsafe_code = "forbid"` interdit `std::env::set_var` depuis l'édition 2024).
test-support = []
