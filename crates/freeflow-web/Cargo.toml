[package]
name = "freeflow-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
freeflow-cli = { version = "0.1.0", path = "../freeflow-cli" }
freeflow-core = { version = "0.1.0", path = "../freeflow-core" }
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tower = "0.5.3"

[dev-dependencies]
http-body-util = "0.1.5"
uuid = { version = "1.26.0", features = ["v7"] }
