name: check
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
  id-token: write
env:
  GRIFFE_NO_OPEN: "1"
  GRIFFE_TEST_KDF: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NEXTEST_PROFILE: ci
jobs:
  # Hors fenêtre : Nix + target + WebKit sur le même SSD (~14 Gio) saturait
  # le runner (`No space left on device` pendant `just check`).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Libérer l'espace disque du runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup
          df -h
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: nix develop --command just fmt-check lint unused test audit
      - run: df -h

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Libérer l'espace disque du runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup
          df -h
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: nix develop --command just lint-desktop
      - run: df -h
