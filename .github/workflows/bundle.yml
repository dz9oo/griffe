name: bundle
on:
  workflow_dispatch:
    inputs:
      publish_aur:
        description: Pousser PKGBUILD et .SRCINFO vers aur.archlinux.org (défaut off)
        type: boolean
        default: false
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NO_STRIP: "1"
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # Séparateur « ; » : linuxdeploy splitEnv. Ces libs sont sur l'excludelist
  # AppImage ; les bundler quand même casse EGL (EGL_BAD_PARAMETER) sur
  # Wayland/Mesa plus récent que le runner. L'hôte fournit libwayland.
  LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-client.so.0;libwayland-cursor.so.0;libwayland-egl.so.1;libwayland-server.so.0"
jobs:
  appimage:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Libérer l'espace disque du runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/.ghcup
          df -h
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dépendances FHS WebKit/GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config \
            build-essential curl file wget xz-utils
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: fhs-appimage
          cache-on-failure: true
      - name: Typst sidecar
        run: |
          set -euo pipefail
          mkdir -p crates/griffe-desktop/binaries
          curl -sSL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          # l'archive pose typst-x86_64-unknown-linux-musl/typst
          src=/tmp/typst-x86_64-unknown-linux-musl/typst
          test -f "$src"
          cp "$src" crates/griffe-desktop/binaries/typst-x86_64-unknown-linux-gnu
          chmod +x crates/griffe-desktop/binaries/typst-x86_64-unknown-linux-gnu
      - name: tauri-cli
        run: cargo install tauri-cli --locked --version 2.11.4
      - name: AppImage
        working-directory: crates/griffe-desktop
        run: cargo tauri build --bundles appimage --config bundle-typst.json
      - name: Checksum et fumée extract
        run: |
          set -euo pipefail
          shopt -s nullglob
          img=(${{ github.workspace }}/target/release/bundle/appimage/*.AppImage)
          test "${#img[@]}" -eq 1
          cd "$(dirname "${img[0]}")"
          chmod +x "$(basename "${img[0]}")"
          ./$(basename "${img[0]}") --appimage-extract
          test -x squashfs-root/usr/bin/griffe-desktop
          # linuxdeploy-plugin-gtk peut encore copier libwayland malgré l'env.
          # Les retirer et recompresser : le Mesa de l'hôte parle au
          # libwayland de l'hôte (double-clic, pas de LD_PRELOAD).
          if find squashfs-root -name 'libwayland-client.so*' | grep -q .; then
            find squashfs-root -name 'libwayland-*.so*' -print -delete
            curl -sSL -o /tmp/appimagetool.AppImage \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x /tmp/appimagetool.AppImage
            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
              /tmp/appimagetool.AppImage squashfs-root "$(basename "${img[0]}")"
          fi
          if find squashfs-root -name 'libwayland-client.so*' | grep -q .; then
            echo "libwayland-client ne doit pas être dans l'AppImage" >&2
            find squashfs-root -name 'libwayland-client.so*' >&2
            exit 1
          fi
          ldd squashfs-root/usr/bin/griffe-desktop | tee /tmp/ldd.txt
          if grep -q /nix/store /tmp/ldd.txt; then
            echo "l'AppImage est lié au store Nix" >&2
            exit 1
          fi
          test -e squashfs-root/usr/bin/typst \
            -o -e squashfs-root/usr/bin/typst-x86_64-unknown-linux-gnu
          # Après un éventuel recompress : le SHA publié doit matcher le fichier.
          sha256sum "$(basename "${img[0]}")" | tee "$(basename "${img[0]}").sha256"
          sha256sum -c "$(basename "${img[0]}").sha256"
      - name: Tarball natif (ELF + Typst, WebKit hôte)
        run: |
          set -euo pipefail
          ver=$(python3 -c 'import json; print(json.load(open("crates/griffe-desktop/tauri.conf.json"))["version"])')
          test -n "$ver"
          elf="${{ github.workspace }}/target/release/griffe-desktop"
          typst="${{ github.workspace }}/crates/griffe-desktop/binaries/typst-x86_64-unknown-linux-gnu"
          icon="${{ github.workspace }}/crates/griffe-desktop/icons/icon.png"
          test -x "$elf"
          test -x "$typst"
          test -f "$icon"
          # Magie ELF, pas de store Nix, WebKit en DT_NEEDED, pas de .so bundlé.
          od -An -N4 -tx1 "$elf" | tr -d ' \n' | grep -qx '7f454c46'
          ldd "$elf" | tee /tmp/ldd-native.txt
          if grep -q /nix/store /tmp/ldd-native.txt; then
            echo "l'ELF natif est lié au store Nix" >&2
            exit 1
          fi
          grep -q 'libwebkit2gtk-4.1.so.0' /tmp/ldd-native.txt
          if grep -E 'not found' /tmp/ldd-native.txt; then
            echo "dépendance manquante sur le runner" >&2
            exit 1
          fi
          file "$elf" | grep -qi 'dynamically linked'
          staging="${{ github.workspace }}/target/release/bundle/native"
          root="$staging/griffe-${ver}-x86_64-linux"
          rm -rf "$staging"
          mkdir -p "$root"
          cp "$elf" "$root/griffe-desktop"
          cp "$typst" "$root/typst"
          chmod +x "$root/griffe-desktop" "$root/typst"
          cp "$icon" "$root/io.github.dz9oo.griffe.png"
          cp "${{ github.workspace }}/LICENSE" "$root/LICENSE"
          cp "${{ github.workspace }}/NOTICE" "$root/NOTICE"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Griffe' \
            'Exec=griffe-desktop' \
            'Icon=io.github.dz9oo.griffe' \
            'StartupWMClass=Griffe-desktop' \
            'Terminal=false' \
            'Categories=Office;Finance;' \
            >"$root/io.github.dz9oo.griffe.desktop"
          if find "$root" \( -name 'libwebkit*' -o -name '*.so' \) | grep -q .; then
            echo "le tarball ne doit pas embarquer de .so" >&2
            find "$root" -name '*.so' >&2
            exit 1
          fi
          tar -C "$staging" -cJf "$staging/griffe-${ver}-x86_64-linux.tar.xz" "griffe-${ver}-x86_64-linux"
          cd "$staging"
          sha256sum "griffe-${ver}-x86_64-linux.tar.xz" | tee "griffe-${ver}-x86_64-linux.tar.xz.sha256"
          sha256sum -c "griffe-${ver}-x86_64-linux.tar.xz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: griffe-linux-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: griffe-linux-native
          path: |
            target/release/bundle/native/*.tar.xz
            target/release/bundle/native/*.sha256
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sha256
            target/release/bundle/native/*.tar.xz
            target/release/bundle/native/*.sha256
  griffe-bin:
    needs: appimage
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      # linux/amd64, library/archlinux:base-devel (2026-09-18).
      # Renouveler : GET https://hub.docker.com/v2/repositories/library/archlinux/tags/base-devel
      # → images[architecture=amd64].digest
      image: archlinux:base-devel@sha256:305558d2bce0b33170f7f7e4ee690633df4b1e0bdfd8194fe45a6545172319ce
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: griffe-linux-native
          path: native-tarball
      - name: Paquet pacman (makepkg, namcap, fumée)
        run: packaging/arch/griffe-bin/ci-makepkg.sh
        env:
          GRIFFE_NATIVE_DIR: ${{ github.workspace }}/native-tarball
          GRIFFE_ARCH_OUT: ${{ github.workspace }}/arch-pkg
          GRIFFE_AUR_OUT: ${{ github.workspace }}/aur-src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: griffe-linux-arch
          path: |
            arch-pkg/*.pkg.tar.zst
            arch-pkg/*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: griffe-aur-src
          path: |
            aur-src/PKGBUILD
            aur-src/.SRCINFO
            aur-src/LICENSE
      - name: GitHub Release (paquet Arch)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            arch-pkg/*.pkg.tar.zst
            arch-pkg/*.sha256
  aur-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_aur
    needs: griffe-bin
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: griffe-aur-src
          path: aur-src
      - name: Pousser vers aur.archlinux.org
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GRIFFE_AUR_SRC: aur-src
        run: packaging/arch/griffe-bin/ci-aur-publish.sh

