[workspace]
resolver = "2"
members = [
    "crates/freeflow-core",
    "crates/freeflow-cli",
    "crates/freeflow-mcp",
    "crates/freeflow-web",
    "crates/freeflow-invoice",
    "crates/freeflow-docs",
    "crates/freeflow-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
# Sur une application locale mono-utilisateur qui tient une comptabilité, un débordement
# arithmétique silencieusement enroulé serait pire qu'un crash : il ferait entrer un montant
# absurde dans les totaux. On préfère un abort bruyant et diagnosticable. Les entrées sont déjà
# bornées en amont (validation des quantités/jours), donc ce filet ne se déclenche qu'en cas de
# bug, jamais sur une donnée métier légitime.
overflow-checks = true
