[workspace]
resolver = "2"
members = [
    "crates/freeflow-core",
    "crates/freeflow-cli",
    "crates/freeflow-mcp",
    "crates/freeflow-web",
    "crates/freeflow-invoice",
    "crates/freeflow-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
